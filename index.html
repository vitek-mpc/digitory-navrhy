<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Digitory – návrhy webů</title>
  <style>
    :root{color-scheme:dark;--bg:#111315;--card:#1a1d20;--text:#f5f7f8;--muted:#9aa3aa;--accent:#d7ad5a}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:24px}.wrap{max-width:760px;width:100%;background:var(--card);border:1px solid #2a2f34;border-radius:24px;padding:42px}.tag{display:inline-flex;padding:8px 12px;border-radius:999px;background:#24282c;color:var(--accent);font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}h1{font-size:clamp(34px,7vw,64px);line-height:1;letter-spacing:-.04em;margin:22px 0 16px}p{color:var(--muted);font-size:18px;line-height:1.65;margin:0}.brand{margin-top:32px;font-weight:800}.brand span{color:var(--accent)}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="tag">Digitory</div>
    <h1>Návrhy nových webů</h1>
    <p>Tato adresa slouží pro neveřejné ukázkové návrhy připravené týmem Digitory pro konkrétní firmy.</p>
    <div class="brand">digitory<span>.cz</span></div>
  </main>
</body>
</html>
