name: Publish email-aligned premium sites

on:
  push:
    paths:
      - '.github/workflows/publish-email-alignment.yml'
      - '.github/scripts/align_personalized_emails.py'
      - '.github/digitory-email-alignment.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-dig-email-2026-10-25
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Check source and regenerate 68 sites
        run: |
          python3 -m py_compile .github/scripts/align_personalized_emails.py
          python3 .github/scripts/align_personalized_emails.py
          git diff --check
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path(".")
          xs=json.load(open(".github/email-alignment-result.json"))
          assert len(xs)==68
          for x in xs:
            folder=root/"2026-10-19-premium"/x["slug"]
            for path in ("index.html","sluzby/index.html","o-firme/index.html","kontakt/index.html",x["detail_slug"]+"/index.html"):
              f=folder/path
              body=f.read_text(encoding="utf8")
              assert f.exists() and 'class="mainmenu"' in body and 'mail-alignment-style' in body,(f,"missing nav or style")
              assert x["focus"] in body,(f,"missing tailored content")
              assert ("/"+x["detail_slug"]+"/") in body,(f,"no link to detail page")
              if path=="index.html":assert 'class="cover-photo"' in body,(f,"missing full-size hero image")
          print("LOCAL_QA_SITES",len(xs),"LOCAL_QA_PAGES",len(xs)*5)
          PY
      - name: Commit and publish rebuilt HTML
        run: |
          git config user.name "Digitory automation"
          git config user.email "digitory-automation@users.noreply.github.com"
          git add 2026-10-19-premium/ .github/email-alignment-result.json
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Align 68 live Digitory websites with 68 personalized outbound emails"
            git push origin HEAD:main
          fi
