name: Verify 68 rebuilt V4 visual websites

on:
  push:
    paths:
      - '.github/workflows/qa-v4-remake.yml'
      - '2026-10-19-premium/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-remake:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - name: Wait for new 4-page publication
        shell: bash
        run: |
          python3 - <<'PY'
          import json,time,urllib.request
          xs=json.load(open("assets/premium3-leads-2026-10-19.json",encoding="utf8"))["firms"]
          url="https://navrhy.digitory.cz/2026-10-19-premium/"+xs[0]["slug"]+"/o-firme/"
          for k in range(48):
            try:
              with urllib.request.urlopen(url,timeout=12) as r:
                s=r.read().decode("utf-8","replace")
                if r.status==200 and "/assets/alik-v4.css" in s and xs[0]["name"] in s:
                  print("DEPLOY_READY",url,flush=True)
                  break
            except Exception as e:print("WAIT",k,str(e)[:80],flush=True)
            time.sleep(10)
          else:raise SystemExit("Pages deployment did not publish the rebuilt 4-page sites")
          PY
      - name: Check all 272 HTML pages and every photo source
        shell: bash
        run: |
          python3 - <<'PY'
          import json,html,urllib.request,concurrent.futures,re,sys
          firms=json.load(open("assets/premium3-leads-2026-10-19.json",encoding="utf8"))["firms"]
          assert len(firms)==68
          root="https://navrhy.digitory.cz"
          def get(url):
            req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 Digitory V4 Remake QA"})
            with urllib.request.urlopen(req,timeout=27) as r:return r.status,r.read(1000000).decode("utf-8","replace")
          def check(t):
            p,suffix=t
            url=root+"/2026-10-19-premium/"+p["slug"]+"/"+suffix
            try:
              status,body=get(url)
              probs=[]
              base="/2026-10-19-premium/"+p["slug"]+"/"
              if status!=200:probs.append("HTTP "+str(status))
              if p["name"] not in html.unescape(body):probs.append("wrong brand")
              if 'rel="stylesheet" href="/assets/alik-v4.css"' not in body:probs.append("not prior V4 style")
              if "/assets/alik-v4.js" not in body:probs.append("not prior V4 script")
              if 'name="viewport"' not in body:probs.append("viewport absent")
              if "<main" not in body:probs.append("main absent")
              if "tel:" not in body:probs.append("phone CTA absent")
              if not suffix and 'class="hero-visual"' not in body:probs.append("image-led hero missing")
              if not suffix and 'class="cover-photo"' not in body:probs.append("hero picture missing")
              for seg in ("","sluzby/","o-firme/","kontakt/"):
                if 'href="'+base+seg+'"' not in body:probs.append("navigation missing "+seg)
              if suffix=="kontakt/" and p["email"] and "mailto:"+p["email"] not in html.unescape(body):probs.append("email omitted")
              if suffix=="kontakt/" and not p["email"] and 'form data-mailto=' in body:probs.append("invalid form without email")
              return url,probs,body
            except Exception as e:return url,[str(e)[:150]],""
          pairs=[(p,s) for p in firms for s in ("","sluzby/","o-firme/","kontakt/")]
          with concurrent.futures.ThreadPoolExecutor(max_workers=18) as pool:result=list(pool.map(check,pairs))
          fails=[(url,issues) for url,issues,_ in result if issues]
          for url,issue in fails:print("PAGE_FAIL",url," | ".join(issue),flush=True)
          print("HTTP_SUMMARY","firms",len(firms),"pages",len(result),"passed",len(result)-len(fails),"failed",len(fails),flush=True)
          pids={img for _,_,body in result for img in re.findall(r'https://images\.unsplash\.com/(photo-[A-Za-z0-9-]+)',body)}
          def photo(id):
            try:return id,get("https://images.unsplash.com/"+id+"?auto=format&w=200&q=45")[0]
            except Exception as e:return id,str(e)[:100]
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:photo_results=list(pool.map(photo,pids))
          bad=[(id,status) for id,status in photo_results if status!=200]
          for id,status in bad:print("PHOTO_FAIL",id,status,flush=True)
          print("PHOTO_SUMMARY","unique",len(pids),"passed",len(pids)-len(bad),"failed",len(bad),flush=True)
          if fails or bad:sys.exit(1)
          PY
      - name: Test site visually in Chrome at 1440 and 390 px
        shell: bash
        run: |
          npm install --prefix /tmp/v4qa --no-save --no-audit --no-fund playwright-core@1.57.0 >/dev/null
          mkdir -p /tmp/v4-screenshots
          cat >/tmp/v4qa/qa.cjs <<'JS'
          const {chromium}=require('playwright-core');
          const fs=require('fs');
          const list=JSON.parse(fs.readFileSync('assets/premium3-leads-2026-10-19.json','utf8')).firms;
          const bin=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium'].find(fs.existsSync);
          if(!bin)throw Error('Chrome not installed');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:bin,args:['--no-sandbox','--disable-dev-shm-usage']});
            const issues=[],seenSectors=new Set();
            for(const viewport of [{width:1440,height:900},{width:390,height:844}]){
              for(let i=0;i<list.length;i+=5)await Promise.all(list.slice(i,i+5).map(async p=>{
                const page=await browser.newPage({viewport});
                const errors=[],url='https://navrhy.digitory.cz/2026-10-19-premium/'+p.slug+'/';
                try{
                  const res=await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
                  if(res.status()!==200)errors.push('HTTP '+res.status());
                  const image=page.locator('img.cover-photo');
                  await image.evaluate(img=>new Promise(ok=>{
                    if(img.complete){ok();return}
                    const t=setTimeout(ok,6000);
                    img.addEventListener('load',()=>{clearTimeout(t);ok()},{once:true});
                    img.addEventListener('error',()=>{clearTimeout(t);ok()},{once:true});
                  }));
                  const data=await page.evaluate(()=>({
                    overflow:document.documentElement.scrollWidth-window.innerWidth,
                    img:document.querySelector('img.cover-photo')?.naturalWidth??0,
                    sections:document.querySelectorAll('main section').length,
                    menuLinks:document.querySelectorAll('#mainmenu a').length,
                    phone:!!document.querySelector('a[href^="tel:"]'),
                    navAbout:!!document.querySelector('#mainmenu a[href$="/o-firme/"]'),
                  }));
                  if(data.overflow>5)errors.push('horizontal overflow '+data.overflow);
                  if(!data.img)errors.push('broken hero image');
                  if(data.sections<4)errors.push('missing content sections');
                  if(data.menuLinks<5||!data.phone||!data.navAbout)errors.push('missing navigation or CTA');
                  if(viewport.width===390){
                    const menu=page.locator('.menu-toggle');
                    if(!(await menu.isVisible()))errors.push('mobile menu hidden');
                    else{
                      await menu.click();
                      if(!(await page.locator('#mainmenu').evaluate(x=>x.classList.contains('open'))))errors.push('menu cannot open');
                      await menu.click();
                      if((await menu.getAttribute('aria-expanded'))!=='false')errors.push('menu cannot close');
                    }
                  }
                  if(viewport.width===1440 && !seenSectors.has(p.sector)){
                    await page.screenshot({path:'/tmp/v4-screenshots/'+p.sector+'-'+p.slug+'.png',fullPage:true,timeout:15000});
                    seenSectors.add(p.sector);
                  }
                }catch(e){errors.push(String(e).slice(0,160))}
                if(errors.length){issues.push({site:p.slug,width:viewport.width,errors});console.log('BROWSER_FAIL',viewport.width,p.slug,errors.join(' / '))}
                else console.log('BROWSER_PASS',viewport.width,p.slug);
                await page.close();
              }));
            }
            await browser.close();
            console.log('BROWSER_SUMMARY',JSON.stringify({sites:list.length,views:list.length*2,failures:issues.length,issues}));
            if(issues.length)process.exit(1);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node /tmp/v4qa/qa.cjs
      - name: Preserve design screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digitory-remake-v4-desktop-screenshots
          path: /tmp/v4-screenshots
          retention-days: 7
          if-no-files-found: ignore
