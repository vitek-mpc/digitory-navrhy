name: Build Alik 6.0 elite sites
on:
  push:
    paths:
      - '.github/workflows/build-alik6-elite-1125.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Generate 65 websites
        run: |
          python3 -m py_compile .github/scripts/build_alik6_elite_1125.py
          python3 .github/scripts/build_alik6_elite_1125.py
          git diff --check
      - name: Publish generated sites
        run: |
          git config user.name "Digitory automation"
          git config user.email "digitory-automation@users.noreply.github.com"
          git add 2026-11-25-elite assets/alik-elite-1125.css assets/alik-elite-1125.js .github/alik6-elite-1125-result.json
          git diff --cached --quiet || git commit -m "Publish Alik 6.0 premium websites"
          git push origin HEAD:main
