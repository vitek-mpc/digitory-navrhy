[build]
  publish = "."

[[redirects]]
  from = "/klimapilot"
  to = "https://klimapilot-demo.vercel.app/klimapilot"
  status = 200
  force = true

[[redirects]]
  from = "/klimapilot/*"
  to = "https://klimapilot-demo.vercel.app/klimapilot/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
